name: Draw keymap

# Guest-only changes never run the normal PDF converter. Missing history retains
# normal artifacts; an explicit manual normal redraw is available below.
on:
  push:
    paths:
      - 'config/totem.keymap'
      - 'config/info.json'
      - 'tools/**'
      - '.github/workflows/draw.yml'
  workflow_dispatch:
    inputs:
      redraw_normal:
        description: 'Explicitly regenerate the normal SVG/PDF'
        type: boolean
        default: false

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install keymap-drawer svglib reportlab

      - name: Compare canonical normal inputs
        id: normal
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_NORMAL: ${{ inputs.redraw_normal }}
        run: |
          if [ "$MANUAL_NORMAL" = true ]; then
            echo 'redraw=true' >> "$GITHUB_OUTPUT"
          else
            if [ -n "$BEFORE" ]; then
              git fetch --no-tags origin "$BEFORE" || echo 'Before fetch failed; projection guard will retain normal artifacts.'
            fi
            echo "redraw=$(python3 tools/prepare-diagram.py guard --before "$BEFORE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Redraw changed normal projection
        if: steps.normal.outputs.redraw == 'true'
        run: tools/draw-layers.sh

      - name: Draw guest views
        run: tools/draw-guest-layers.sh

      - name: Test projections and drawings
        run: python3 -m unittest discover -s tools/tests

      - uses: actions/upload-artifact@v4
        with:
          name: keymap-diagrams
          path: |
            totem-layers.svg
            totem-layers.pdf
            totem-guest-layers.svg
            totem-guest-layers.pdf

      - name: Commit diagrams if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add totem-layers.svg totem-layers.pdf totem-guest-layers.svg totem-guest-layers.pdf
          git diff --staged --quiet || {
            git commit -m "Redraw keymap diagrams [skip ci]"
            git push
          }
