# --- radio -------------------------------------------------------------
# Max TX power. Buys range, costs battery. Comment out if the halves sit
# close together and you want the runtime back.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- battery reporting -------------------------------------------------
# The left (central) half fetches the right half's level and proxies both
# to the host, so the OS shows two batteries.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- power -------------------------------------------------------------
# Deep sleep after 15 min idle. Off by default in ZMK; both halves run on
# batteries here, so it matters.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- features ----------------------------------------------------------
CONFIG_ZMK_POINTING=y
